<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Nocturne TeamSpeak theme preview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#10172a"/>
      <stop offset="100%" stop-color="#070b14"/>
    </linearGradient>
    <radialGradient id="glowA" cx="28%" cy="18%" r="52%">
      <stop offset="0%" stop-color="#ffb347" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="82%" cy="20%" r="44%">
      <stop offset="0%" stop-color="#55d6be" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#55d6be" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffcf7a"/>
      <stop offset="100%" stop-color="#ff8f1f"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#74ead5"/>
      <stop offset="100%" stop-color="#2ebaa0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="28" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#glowA)"/>
  <rect width="1600" height="1000" fill="url(#glowB)"/>

  <g filter="url(#shadow)">
    <rect x="82" y="84" width="1436" height="832" rx="34" fill="#0f1527" stroke="rgba(255,255,255,0.08)"/>
    <rect x="82" y="84" width="1436" height="88" rx="34" fill="#0b1120"/>
    <rect x="82" y="140" width="1436" height="32" fill="#0b1120"/>

    <rect x="112" y="120" width="220" height="36" rx="18" fill="#151d31"/>
    <circle cx="144" cy="138" r="8" fill="#55d6be"/>
    <text x="164" y="143" font-family="Segoe UI, sans-serif" font-size="18" fill="#eef2ff">Nocturne</text>

    <g fill="#c6d2f0" font-family="Segoe UI, sans-serif" font-size="16">
      <text x="742" y="139">Servers</text>
      <text x="840" y="139" fill="#ffcf7a">Channels</text>
      <text x="955" y="139">Chat</text>
      <text x="1024" y="139">Files</text>
    </g>

    <rect x="112" y="206" width="318" height="662" rx="26" fill="#12192d" stroke="rgba(255,255,255,0.06)"/>
    <rect x="452" y="206" width="718" height="662" rx="26" fill="#11182c" stroke="rgba(255,255,255,0.06)"/>
    <rect x="1190" y="206" width="298" height="662" rx="26" fill="#12192d" stroke="rgba(255,255,255,0.06)"/>

    <rect x="142" y="236" width="248" height="58" rx="18" fill="#171f35"/>
    <circle cx="172" cy="265" r="12" fill="url(#accent)"/>
    <text x="198" y="270" font-family="Segoe UI, sans-serif" font-size="20" fill="#eef2ff">Aurora Lobby</text>

    <text x="142" y="344" font-family="Segoe UI, sans-serif" font-size="15" fill="#9faecf">Voice channels</text>
    <rect x="142" y="366" width="248" height="48" rx="14" fill="#151d31"/>
    <rect x="142" y="424" width="248" height="48" rx="14" fill="#151d31"/>
    <rect x="142" y="482" width="248" height="48" rx="14" fill="#151d31"/>
    <rect x="142" y="540" width="248" height="48" rx="14" fill="#151d31"/>

    <text x="176" y="397" font-family="Segoe UI, sans-serif" font-size="18" fill="#cfe4ff">General</text>
    <text x="176" y="455" font-family="Segoe UI, sans-serif" font-size="18" fill="#cfe4ff">Strategy</text>
    <text x="176" y="513" font-family="Segoe UI, sans-serif" font-size="18" fill="#cfe4ff">Music</text>
    <text x="176" y="571" font-family="Segoe UI, sans-serif" font-size="18" fill="#cfe4ff">AFK</text>

    <rect x="482" y="236" width="654" height="76" rx="22" fill="#162037"/>
    <rect x="482" y="334" width="654" height="430" rx="22" fill="#0e1527"/>
    <rect x="482" y="786" width="654" height="48" rx="16" fill="#171f35"/>

    <text x="516" y="282" font-family="Segoe UI, sans-serif" font-size="22" fill="#eef2ff">Welcome back</text>
    <text x="516" y="425" font-family="Segoe UI, sans-serif" font-size="18" fill="#9fb0d1">The theme uses deep surfaces, amber highlights, and teal secondary accents.</text>
    <rect x="516" y="464" width="210" height="52" rx="16" fill="url(#accent)"/>
    <text x="548" y="496" font-family="Segoe UI, sans-serif" font-size="18" font-weight="600" fill="#1b1206">Primary action</text>
    <rect x="744" y="464" width="178" height="52" rx="16" fill="#1b243d" stroke="rgba(255,255,255,0.08)"/>
    <text x="784" y="496" font-family="Segoe UI, sans-serif" font-size="18" fill="#e6eefc">Secondary</text>

    <rect x="516" y="564" width="584" height="112" rx="20" fill="#151d31"/>
    <circle cx="555" cy="620" r="22" fill="url(#accent2)"/>
    <text x="594" y="612" font-family="Segoe UI, sans-serif" font-size="18" fill="#eef2ff">Readable contrast</text>
    <text x="594" y="640" font-family="Segoe UI, sans-serif" font-size="16" fill="#9fb0d1">High-contrast text and soft borders keep the interface calm.</text>

    <rect x="1220" y="236" width="238" height="86" rx="22" fill="#171f35"/>
    <rect x="1220" y="336" width="238" height="242" rx="22" fill="#151d31"/>
    <rect x="1220" y="594" width="238" height="244" rx="22" fill="#151d31"/>
    <text x="1250" y="285" font-family="Segoe UI, sans-serif" font-size="18" fill="#eef2ff">Status</text>
    <text x="1250" y="316" font-family="Segoe UI, sans-serif" font-size="14" fill="#9fb0d1">Online, busy, muted</text>
    <text x="1250" y="385" font-family="Segoe UI, sans-serif" font-size="16" fill="#cfe4ff">Accent balance</text>
    <rect x="1250" y="405" width="178" height="14" rx="7" fill="#0f1527"/>
    <rect x="1250" y="405" width="112" height="14" rx="7" fill="url(#accent)"/>
    <text x="1250" y="475" font-family="Segoe UI, sans-serif" font-size="16" fill="#cfe4ff">Secondary color</text>
    <rect x="1250" y="495" width="178" height="14" rx="7" fill="#0f1527"/>
    <rect x="1250" y="495" width="92" height="14" rx="7" fill="url(#accent2)"/>
    <text x="1250" y="647" font-family="Segoe UI, sans-serif" font-size="16" fill="#cfe4ff">Focus states</text>
    <text x="1250" y="677" font-family="Segoe UI, sans-serif" font-size="14" fill="#9fb0d1">Outlined in amber for quick scanning.</text>
    <rect x="1250" y="721" width="178" height="48" rx="16" fill="#1b243d" stroke="rgba(255,179,71,0.4)"/>
    <text x="1285" y="752" font-family="Segoe UI, sans-serif" font-size="16" fill="#eef2ff">Focused</text>
  </g>
</svg>